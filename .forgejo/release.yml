changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - forgejo-actions
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: New Features
      labels:
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
    - title: Dependency Changes
        - dependency
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - non-functional
        - "*"
