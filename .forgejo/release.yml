changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - forgejo-actions
  categories:
    - title: Breaking Changes
      labels:
        - breaking
        - semver:major
    - title: New Features
      labels:
        - feature
        - enhancement
        - semver:minor
    - title: Bug Fixes
      labels:
        - bug
        - fix
        - semver:patch
    - title: Other Changes
      labels:
        - "*"
