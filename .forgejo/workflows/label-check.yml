name: Label Check

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

jobs:
  label-check:
    runs-on: xsmall
    permissions:
      pull-requests: read
    steps:
      - name: Enforce PR label
        uses: custom-actions/label-check@db47e421ebd013c7dcd89f91d891c0a8ae83a5b0 # v0.1.10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          mode: at-least-one
          labels: |
            breaking
            enhancement
            dependency
            bug
            documentation
            non-functional
