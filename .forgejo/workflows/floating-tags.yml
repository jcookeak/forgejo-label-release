name: Floating Tags

on:
  release:
    types: [published]

# Share the publication queue with the self-release workflow.
concurrency:
  group: label-release-self-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: xsmall
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3.7.0 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Legacy release tags predate the helper; use trusted main plumbing.
          # The helper resolves the published tag itself, never target_commitish.
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Move floating tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/self-release.ts floating
