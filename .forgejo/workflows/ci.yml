name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: standard
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Commit formatting changes
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "forgejo-actions[bot]"
            git config user.email "forgejo-actions[bot]@users.noreply.forgejo.org"

            git add --all
            git commit -m "chore: format"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit updated dist
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain -- dist/)" ]]; then
            git config user.name "forgejo-actions[bot]"
            git config user.email "forgejo-actions[bot]@users.noreply.forgejo.org"

            git add dist/
            git commit -m "chore: update dist"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Smoke test
        run: npm run smoke
