name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: standard
    permissions:
      contents: read
    steps:
      - name: Validate PR commit
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fork heads are available via the base repository's refs/pull/*.
          # Keep the token scoped to that repository and fetch the immutable SHA.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm run smoke
