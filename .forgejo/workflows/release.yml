name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-arm-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cut release
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-template: .forgejo/release.yml
