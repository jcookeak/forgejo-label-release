name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: xsmall
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build release artifacts
        run: npm ci && npm run build

      - name: Publish release artifacts branch
        id: artifacts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.forgejo.org"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore: build release artifacts for ${GITHUB_SHA::12}"
          fi
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" push --force origin "HEAD:refs/heads/release-artifacts"
          echo "sha=$(git rev-parse HEAD)" >> "$FORGEJO_OUTPUT"

      - name: Cut release
        id: release
        uses: custom-actions/label-release@d8b890e0623119d3d0405ffd65eedf5fc0875e2c # v0.0.16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-template: .forgejo/release.yml
          target-commitish: ${{ steps.artifacts.outputs.sha }}
          major-labels: breaking
          minor-labels: enhancement
          patch-labels: bug, dependency

      - name: Move floating tags
        if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARTIFACT_SHA: ${{ steps.artifacts.outputs.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "$TAG" =~ ^(v?)(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::notice::Not a stable semver tag — skipping floating tags."
            exit 0
          fi
          major="${BASH_REMATCH[1]}${BASH_REMATCH[2]}"
          minor="${major}.${BASH_REMATCH[3]}"
          [[ "$ARTIFACT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "$ARTIFACT_SHA^{commit}"
          sha="$ARTIFACT_SHA"

          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.forgejo.org"

          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"

          for floating in "$major" "$minor"; do
            echo "Updating $floating -> $sha"
            git tag -f "$floating" "$sha"
            git -c "http.extraHeader=AUTHORIZATION: basic $auth" push -f origin "refs/tags/$floating"
          done
