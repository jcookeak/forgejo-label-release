name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: xsmall
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build release artifacts
        run: npm ci && npm run build

      - name: Publish release artifacts branch
        id: artifacts
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.forgejo.org"
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore: build release artifacts for ${GITHUB_SHA::12}"
          fi
          git push --force origin "HEAD:release-artifacts"
          echo "sha=$(git rev-parse HEAD)" >> "$FORGEJO_OUTPUT"

      - name: Cut release
        id: release
        uses: custom-actions/label-release@v0.0.16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-template: .forgejo/release.yml
          target-commitish: ${{ steps.artifacts.outputs.sha }}
          major-labels: breaking
          minor-labels: enhancement
          patch-labels: bug, dependency

      - name: Move floating tags
        if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! [[ "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "::notice::Tag '$TAG' is not a plain semver tag — skipping floating tags."
            exit 0
          fi
          if [[ -n "${BASH_REMATCH[4]:-}" ]]; then
            echo "::notice::Tag '$TAG' is a prerelease — skipping floating tags."
            exit 0
          fi

          prefix=""
          [[ "$TAG" == v* ]] && prefix="v"
          major="${prefix}${BASH_REMATCH[1]}"
          minor="${prefix}${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.forgejo.org"

          remote="https://x-access-token:${TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"

          for floating in "$major" "$minor"; do
            echo "Updating $floating -> ${{ steps.artifacts.outputs.sha }}"
            git tag -f "$floating" "${{ steps.artifacts.outputs.sha }}"
            git push -f "$remote" "refs/tags/$floating"
          done
