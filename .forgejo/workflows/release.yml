name: Release

on:
  push:
    branches: [main]

# Forgejo 17 supports workflow concurrency queues. The instance setting
# [actions].CONCURRENCY_GROUP_QUEUE_ENABLED must remain enabled (default: true).
concurrency:
  group: label-release-self-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xsmall
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v3.7.0 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Build before using the local action, including its explicit publish API.
      - name: Build release artifacts
        run: npm ci && npm run build

      - name: Recover source release plan
        id: recover
        env:
          SOURCE_SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/self-release.ts recover

      - name: Plan release from source
        if: steps.recover.outputs.recovered != 'true'
        id: version
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-commitish: ${{ github.sha }}
          release-template: .forgejo/release.yml
          major-labels: breaking
          minor-labels: enhancement
          patch-labels: bug, dependency
          dry-run: "true"

      - name: Publish version artifacts branch
        id: artifacts
        env:
          SOURCE_SHA: ${{ github.sha }}
          TAG: ${{ steps.recover.outputs.tag || steps.version.outputs.tag }}
          NOTES: ${{ steps.recover.outputs.notes || steps.version.outputs.notes }}
          BUMP: ${{ steps.recover.outputs.bump || steps.version.outputs.bump }}
          PREVIOUS_TAG: ${{ steps.recover.outputs.previous-tag || steps.version.outputs.previous-tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/self-release.ts artifacts

      - name: Publish planned release
        if: steps.artifacts.outputs.sha != ''
        id: release
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish-tag: ${{ steps.artifacts.outputs.tag }}
          release-notes: ${{ steps.artifacts.outputs.notes }}
          target-commitish: ${{ steps.artifacts.outputs.sha }}

      - name: Move floating tags
        if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ARTIFACT_SHA: ${{ steps.artifacts.outputs.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/self-release.ts floating
